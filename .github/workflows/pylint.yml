name: CI

on:
  push:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test-matrix:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check git version
        run: git --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
      - name: Validate compatibility baseline
        run: python -c "from utils.compatibility import build_runtime_compatibility_report; report = build_runtime_compatibility_report(); assert report['python_supported'], report; assert report['git_supported'], report; print(report)"
      - name: Run unit tests
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: CLI smoke test
        run: python downloader.py --help

  package-check:
    name: Package Build and Smoke (ubuntu-latest, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine pipx
      - name: Build distribution
        run: python -m build
      - name: Validate package metadata
        run: twine check dist/*
      - name: Install wheel with pipx
        run: pipx install --force dist/*.whl
      - name: Smoke test packaged CLI
        run: |
          repo-downloader --help
          repo-downloader list-backups --output-dir ./backups

  coverage:
    name: Coverage and Codecov (ubuntu-latest, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
          pip install coverage
      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py"
          coverage xml -o coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

  lint:
    name: Lint (ubuntu-latest, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
          pip install pylint
      - name: Analysing the code with pylint
        run: pylint $(git ls-files '*.py')
