name: Publish TestPyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-test-install:
    runs-on: ubuntu-latest
    needs: publish-testpypi
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from TestPyPI and smoke test CLI
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python -m pip install --upgrade pip
          for attempt in {1..5}; do
            if pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "repo-downloader==${version}"; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "Package not available on TestPyPI after 5 attempts."
              exit 1
            fi
            echo "Package not available yet; retrying in 15s (attempt ${attempt}/5)..."
            sleep 15
          done
          repo-downloader --help
          repo-downloader list-backups --output-dir ./backups
